  <text x="430" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B717C" text-anchor="start">Ringkasan untuk manajemen</text>
  <text x="430" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#1B1F27"><tspan x="430" dy="0">Dari tiga outlet, Cabang A memimpin dengan skor</tspan><tspan x="430" dy="23.2">81,2, sedangkan Cabang C tertinggal di 62,5 terutama</tspan><tspan x="430" dy="23.2">karena kecepatan pelayanan dan kebersihan area</tspan><tspan x="430" dy="23.2">duduk. Upselling hampir tidak dilakukan di semua</tspan><tspan x="430" dy="23.2">outlet. Prioritas manajemen: standar waktu saji</tspan><tspan x="430" dy="23.2">lintas outlet dan pelatihan upselling singkat.</tspan></text>
  <rect x="430" y="440" width="150" height="84" rx="12" fill="#F8F5EE"/>
