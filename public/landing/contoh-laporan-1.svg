  <text x="608" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6B717C" text-anchor="start">Outlet</text><text x="608" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1B1F27"><tspan x="608" dy="0">3 outlet · 4</tspan><tspan x="608" dy="18.75">kunjungan</tspan></text><rect x="754" y="440" width="150" height="84" rx="12" fill="#F8F5EE"/>
