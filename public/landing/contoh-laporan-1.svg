  <text x="924" y="40" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#9AA0AB" text-anchor="end">Laporan Audit CX · PT ABC · PRJ-0013</text>
  <text x="48" y="118" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1B1F27" text-anchor="start">Ringkasan skor CX</text>
  
